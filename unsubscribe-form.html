<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Unsubscribe</title>
<style>
  body { font-family: system-ui, sans-serif; background:#f5f5f7; display:flex; justify-content:center; padding:40px; }
  .contact-form { background:#fff; padding:24px; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.08); width:100%; max-width:480px; display:flex; flex-direction:column; gap:12px; }
  .form-row { display:flex; gap:12px; }
  .form-row input { flex:1; }
  input, textarea { padding:10px 12px; border:1px solid #ddd; border-radius:8px; font-size:14px; font-family:inherit; }
  .button.primary { background:#4f46e5; color:#fff; border:none; padding:12px; border-radius:8px; font-size:15px; cursor:pointer; }
  .button.primary:disabled { opacity:.6; cursor:not-allowed; }
  #formStatus { font-size:14px; min-height:20px; }
  #formStatus.success { color:#16a34a; }
  #formStatus.error { color:#dc2626; }
</style>
</head>
<body>

<form class="contact-form" id="unsubscribeForm">
  <input type="email" name="email" placeholder="Email Address" required>
  <button class="button primary" type="submit">Unsubscribe</button>
  <div id="formStatus"></div>
</form>

<script>
// Paste your Apps Script (or other) endpoint URL here
const SHEET_ENDPOINT = "https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec";

const form = document.getElementById('unsubscribeForm');
const status = document.getElementById('formStatus');
const submitBtn = form.querySelector('button[type="submit"]');

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const data = { email: form.email.value.trim() };

  submitBtn.disabled = true;
  submitBtn.textContent = "Processing...";
  status.textContent = "";
  status.className = "";

  try {
    await fetch(SHEET_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(data)
    });

    status.textContent = "You've been unsubscribed.";
    status.className = "success";
    form.reset();
  } catch (err) {
    status.textContent = "Something went wrong. Please try again.";
    status.className = "error";
    console.error(err);
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Unsubscribe";
  }
});
</script>

</body>
</html>
